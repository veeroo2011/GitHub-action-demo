name: call reusable matrix workflow

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ matrix.environment }}
    strategy:
      matrix:
        include:
          - environment: Dev
            region: us-east-1
            aws_role: GitHubActions-Dev
          - environment: QA
            region: us-east-1
            aws_role: GitHubActions-QA
          - environment: PROD
            region: us-east-1
            aws_role: GitHubActions-PROD

    uses: ./.github/workflows/reusable-matrix.yml
    with:
      environment: ${{ matrix.environment }}
      region: ${{ matrix.region }}
      aws_role: ${{ matrix.aws_role }}
          
