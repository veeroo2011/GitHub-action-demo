name: This workflow is a demo for reusable workflows

on: 
  push:
    branches:
      - main
  workflow_dispatch: # allows manual runs from the Actions tab
  pull_request:
    branches:
      - main
permissions:
  actions: read
  contents: read
  security-events: write 
  packages: write

jobs:
  ci-cd-pipeline-job:
    uses: veeroo2011/reusable-workflows/.github/workflows/cicd_workflow.yml@main
    with:
      run_unit_tests: true
      run_codeql: true
      run_sonarqube: true
      run_Docker-Image-push: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  deploy-job-k8s:
    uses: veeroo2011/reusable-workflows/.github/workflows/deploy_with_kubectl.yaml@main
    with:
      NAMESPACE: 'staging'
      IMAGE_NAME: 'veeroo2011/thinknyx_app'
      RUNNER_LABELS: 'ubuntu-latest'
    secrets:
      KUBECONFIG: ${{ secrets.KUBECONFIG }}